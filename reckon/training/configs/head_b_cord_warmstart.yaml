# Ablation arm: CORD warm-start on/off (brief section 4.1).
#
# CORD is receipt line items - structurally analogous to a hospital bill table.
# The brief asks for this to be ABLATED, not assumed helpful. It may not
# transfer, and "warm-starting did not help" is a reportable result.
#
# Run head_b.yaml and this file, and report both numbers.
head: b
base_model: naver-clova-ix/donut-base
warm_start_from: naver-clova-ix/donut-base-finetuned-cord-v2
manifest: data/synthetic/manifest.jsonl
out_dir: outputs/head_b_cord

image_height: 1280
image_width: 960
max_length: 1024

epochs: 3.0
batch_size: 1
grad_accum: 12
lr: 3.0e-5
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

fp16: true
gradient_checkpointing: true
optim_8bit: true

seed: 1337
checkpoint_every: 200
keep_last: 2
drive_dir: null
hub_repo: null
push_to_hub: false
log_every: 25
