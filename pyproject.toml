[project]
name = "reckon"
version = "2.0.0.dev0"
description = "RECKON v2 - document understanding for Indian hospital bills, with honest v1-vs-v2 evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

# Phase 1 runtime deps only. Later phases add their own; every addition is
# licence-checked (MIT / Apache-2.0 / BSD only) before it lands here.
dependencies = [
    "augraphy>=8.2,<9",
    "jinja2>=3.1,<4",
    "pillow>=10.4,<12",
    "playwright>=1.47,<2",
    "pydantic>=2.9,<3",        # MIT
    "pyyaml>=6,<7",
    "rapidfuzz>=3.9,<4",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",          # MIT
    "import-linter>=2.1,<3",   # BSD-2-Clause
    "pre-commit>=3.8,<5",      # MIT
]
serve = [
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "httpx2>=2.12.0",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling"]       # MIT
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reckon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
